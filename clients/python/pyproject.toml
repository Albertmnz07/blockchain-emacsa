[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aguas-ingest"
version = "0.1.0"
description = "Cliente Python para la API de ingesta de Aguas de Córdoba (EIP-712 + Merkle + HTTP)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Aguas de Córdoba" },
]
dependencies = [
  "pydantic>=2.6",
  "eth-account>=0.11.0",
  "eth-utils>=4.0.0",
  "eth-abi>=5.0.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "pyright>=1.1.380",
  "types-requests>=2.31.0.20240406",
]

[project.scripts]
aguas-ingest = "aguas_ingest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aguas_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pyright]
include = ["aguas_ingest", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = false
